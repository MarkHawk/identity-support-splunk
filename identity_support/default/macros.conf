[support_index]
definition = index=identity_support
description = Where the app's data lives. Override in local/macros.conf to use another index.

[support_failures]
definition = `support_index` ((tag=authentication action=failure) OR eventtype=idlab_radius_no_reply OR eventtype=idlab_nas_challenge_discarded OR eventtype=idlab_keycloak_ldap_error OR eventtype=idlab_proxy_error OR eventtype=idlab_egress_error OR eventtype=idlab_api_cors_mismatch)
description = Every failure the app knows a cause for: failed logins (CIM Authentication), RADIUS packets dropped without a reply, MFA challenges the NAS discarded, Keycloak's LDAP errors, requests the reverse proxy refused, the egress proxy's refusals, and API calls a browser blocks because the API's CORS header doesn't match the page's origin (the API logs them as successes).

[egress_idp_hosts]
definition = dest_host=keycloak
description = The IdP's host as the egress proxy sees it in a CONNECT. Override in local/macros.conf, for example (dest_host=idp.example.com OR dest_host=login.example.com).

[support_chart(1)]
args = by
definition = eventstats min(_time) as bucket_first max(_time) as bucket_last \
| eval bucket_range=bucket_last-bucket_first, bucket_span=case(bucket_range<=900, 10, bucket_range<=7200, 60, bucket_range<=28800, 300, bucket_range<=172800, 1800, true(), 3600), _time=floor(_time/bucket_span)*bucket_span \
| appendpipe [| stats min(_time) as gap_from max(_time) as gap_to max(bucket_span) as gap_step | eval gap_time=mvrange(gap_from, gap_to + gap_step, gap_step) | mvexpand gap_time | eval _time=gap_time | fields _time] \
| chart count over _time by $by$ limit=11 useother=false usenull=true nullstr="bucket_gap_fill" \
| fields - bucket_gap_fill \
| fillnull value=0
description = Like timechart count by <field>, but the bucket size follows the data, not the time picker: 10 seconds for an incident of up to 15 minutes, 1 minute up to 2 hours, 5 minutes up to 8 hours, 30 minutes up to 2 days, then 1 hour. Empty buckets between the first and last event are filled with zeros (the appendpipe adds one row per bucket, counted under a bucket_gap_fill series that is then dropped; a name starting with _ would come back as VALUE_...), and the top 10 values of <field> are shown. A two-minute incident shows as a dozen columns, not one sliver in a 4-hour chart.

[support_redirect_loops]
definition = `support_index` sourcetype=idlab:sp event=force_https \
| eval xfp=coalesce(x_forwarded_proto, "-"), loop_app=sp_app . if(match(source, "-(proxied|egress|edge)$"), replace(source, "^.*(-proxied|-egress|-edge)$", "\1"), "") \
| sort 0 _time \
| streamstats current=f last(_time) as loop_prev by host loop_app path xfp \
| eval loop_new=if(isnull(loop_prev) OR _time - loop_prev > 2, 1, 0) \
| streamstats sum(loop_new) as loop_burst by host loop_app path xfp \
| stats min(_time) as _time max(_time) as loop_end count as redirects by host loop_app path xfp loop_burst \
| where redirects >= 5 \
| eval app=loop_app, route=path, signature=case(xfp=="-", "redirect_loop_no_forwarded_proto", match(xfp, "(?i)https"), "redirect_loop_proxy_hops", true(), "redirect_loop_forwarded_not_https") \
| lookup support_causes signature OUTPUT cause runbook runbook_url \
| fields _time host loop_end redirects app route signature cause runbook runbook_url
description = Redirect loops: an app that forces HTTPS redirecting the same path again and again. The app's force_https line names no client (behind a proxy that lost X-Forwarded-For, every client has the proxy's address anyway), so redirects are grouped by app copy, path and the X-Forwarded-Proto that arrived; a run of 5 or more, each within 2 seconds of the last, is one loop: one browser giving up (Chrome follows 20). One row per loop, with its first and last redirect, how many, and the likely cause. A lone redirect (someone typing http://) is not a loop.

[support_count_once_per_login]
definition = eval egress_app_time=if(like(signature, "egress_app_%"), _time, null()), egress_is_app=if(isnotnull(egress_app_time), 1, 0) \
| sort 0 _time - egress_is_app \
| streamstats last(egress_app_time) as egress_app_before by cause \
| sort 0 - _time - egress_is_app \
| streamstats last(egress_app_time) as egress_app_after by cause \
| eval counted=if(like(signature, "egress_proxy_%") AND ((isnotnull(egress_app_before) AND _time - egress_app_before <= 2) OR (isnotnull(egress_app_after) AND egress_app_after - _time <= 2)), 0, 1) \
| fields - egress_app_time egress_is_app egress_app_before egress_app_after
description = Sets counted=1 on each failure that counts, 0 on the ones that repeat another. One failed login through the egress proxy is logged twice, by Squid (its refusal) and by the app (its failed call to the IdP), with the same cause: a Squid line within 2 seconds of an app line for the same cause gets counted=0, so sum(counted) is one per login. Squid's refusals with no app line (another client, or an app that doesn't log) still count. The events stay, so a cause row still lists both sides' apps and routes. An app line sorts before a Squid line with the same time in both passes, so the two always pair.

[support_radius_mfa_events]
definition = `support_index` (eventtype=idlab_radius_auth OR eventtype=idlab_radius_challenge OR eventtype=idlab_radius_invalid_user OR eventtype=idlab_nas_challenge_discarded)
description = The RADIUS lines support_radius_mfa needs: Login OK and Login incorrect, the server's Access-Challenge and Invalid user lines, and the NAS's discarded challenges. Add it to a search of failures, then pipe through `support_radius_mfa`.

[support_radius_mfa]
definition = eval rmfa_kind=case(sourcetype=="idlab:radius" AND radius_outcome=="Access-Challenge", "challenge", sourcetype=="idlab:radius" AND isnotnull(radius_invalid_user), "invalid", sourcetype=="idlab:radius" AND (radius_result=="OK" OR (radius_result=="incorrect" AND isnull(radius_reason))), "answer", sourcetype=="idlab:radius" AND radius_result=="incorrect", "first", sourcetype=="idlab:nas" AND isnotnull(nas_discard_reason), "nas") \
| eval rmfa_key=if(sourcetype=="idlab:radius" AND isnotnull(rmfa_kind), host . "|" . nas_client . "|" . user, null()), rmfa_user=if(isnotnull(rmfa_kind), host . "|" . user, null()), rmfa_sec=if(isnotnull(radius_request_id), floor(_time), null()) \
| eventstats count(eval(rmfa_kind=="invalid")) as rmfa_invalid by host radius_request_id rmfa_sec \
| eval rmfa_nas_time=if(rmfa_kind=="nas", _time, null()), rmfa_nas_sig=if(rmfa_kind=="nas", signature, null()), rmfa_chal_time=if(rmfa_kind=="challenge", _time, null()) \
| sort 0 _time \
| streamstats current=f window=1 last(rmfa_kind) as rmfa_prev_kind last(_time) as rmfa_prev_time by rmfa_key \
| streamstats current=f last(rmfa_chal_time) as rmfa_chal_before by rmfa_user \
| sort 0 - _time \
| streamstats current=f window=1 last(rmfa_kind) as rmfa_next_kind last(_time) as rmfa_next_time by rmfa_key \
| streamstats current=f last(rmfa_nas_time) as rmfa_nas_after last(rmfa_nas_sig) as rmfa_nas_after_sig by rmfa_user \
| eval rmfa_answered=if(rmfa_kind=="challenge" AND (rmfa_next_kind=="answer" OR rmfa_next_kind=="invalid") AND rmfa_next_time - _time <= 60, 1, 0), rmfa_judged=if(rmfa_kind=="challenge" AND (isnotnull(rmfa_next_time) OR now() - _time > 60), 1, 0), rmfa_nas_paired=if(rmfa_kind=="challenge" AND isnotnull(rmfa_nas_after) AND rmfa_nas_after - _time >= 0 AND rmfa_nas_after - _time <= 5, 1, 0) \
| eval signature=case(rmfa_kind=="answer" AND radius_result=="incorrect" AND rmfa_invalid > 0, "radius_reject_unknown_state", rmfa_kind=="answer" AND radius_result=="incorrect" AND rmfa_prev_kind=="challenge" AND _time - rmfa_prev_time <= 60, "radius_reject_wrong_code", rmfa_kind=="challenge" AND rmfa_answered==0 AND rmfa_nas_paired==1, rmfa_nas_after_sig, rmfa_kind=="challenge" AND rmfa_answered==0, "radius_challenge_unanswered", true(), signature), action=if(rmfa_kind=="challenge" AND rmfa_answered==0, "failure", action), rmfa_uncounted=if(rmfa_kind=="nas" AND isnotnull(rmfa_chal_before) AND _time - rmfa_chal_before <= 5, 1, null()) \
| where isnull(rmfa_kind) OR rmfa_kind=="answer" OR rmfa_kind=="first" OR rmfa_kind=="nas" OR (rmfa_kind=="challenge" AND rmfa_answered==0 AND rmfa_judged==1) \
| where isnull(rmfa_kind) OR action=="failure" OR rmfa_kind=="nas" \
| sort 0 _time \
| fields - rmfa_key rmfa_user rmfa_sec rmfa_invalid rmfa_nas_time rmfa_nas_sig rmfa_chal_time rmfa_prev_kind rmfa_prev_time rmfa_chal_before rmfa_next_kind rmfa_next_time rmfa_nas_after rmfa_nas_after_sig rmfa_answered rmfa_judged rmfa_nas_paired
description = RADIUS MFA, read from the lines around each one, per server, NAS and user, in time order. A Login incorrect with no reason within 60 s of a challenge (the server's State lasts a minute) is a wrong, expired or reused one-time code: radius_reject_wrong_code. An Invalid user and the Login incorrect with the same request number are a second-round request with a State the server didn't issue: radius_reject_unknown_state. A challenge counts as answered only by the NAS's second request: Login OK, a Login incorrect with no reason, or Invalid user, within 60 s. A Login incorrect with a reason (the directory refused the password) is a new attempt, not an answer. An unanswered challenge becomes a failure, named after the NAS's discard line within 5 s if there is one (nas_challenge_unsupported, nas_challenge_no_message_authenticator), else radius_challenge_unanswered. That discard line then has rmfa_uncounted=1, so one attempt counts once. Answered challenges and Invalid user lines are dropped, and so is a challenge less than a minute old with nothing after it yet. Events that are not RADIUS MFA lines pass through unchanged.

[support_kc_user_ids]
definition = (`support_index` sourcetype=idlab:sp event=oidc_login_ok sub=*)
description = Events that name a user and their Keycloak user ID, for support_kc_user_from_id: the OIDC RP's successful logins (sub is Keycloak's user ID). Keycloak's own failures that name both are already among the failures. Add it to a search of failures, then drop these rows again (kcid_join_only=1).

[support_kc_user_from_id]
definition = eval kcid_key=case(sourcetype=="idlab:keycloak" AND isnotnull(kc_userId) AND kc_userId!="null", kc_userId, sourcetype=="idlab:sp" AND event=="oidc_login_ok", sub), kcid_kc=if(sourcetype=="idlab:keycloak" AND isnotnull(kc_username) AND kc_username!="null", kc_username, null()), kcid_rp=if(sourcetype=="idlab:sp" AND event=="oidc_login_ok", coalesce(preferred_username, email), null()), kcid_join_only=if(sourcetype=="idlab:sp" AND event=="oidc_login_ok", 1, null()) \
| eventstats values(kcid_kc) as kcid_kc_names values(kcid_rp) as kcid_rp_names by kcid_key \
| eval user_from_id=if(isnull(user) AND isnotnull(coalesce(mvindex(kcid_kc_names, 0), mvindex(kcid_rp_names, 0))), 1, null()), user=coalesce(user, mvindex(kcid_kc_names, 0), mvindex(kcid_rp_names, 0)) \
| fields - kcid_key kcid_kc kcid_rp kcid_kc_names kcid_rp_names
description = Names the user of a Keycloak event that only has their user ID (a wrong one-time code: Keycloak logs userId and selected_credential_id, not the username). The name comes from another event in the same search with the same ID: Keycloak's own (the lockout line names both), preferred, else the OIDC RP's successful login (sub is the user ID; the name is its email). Sets user_from_id=1 where it filled in the user. It can't when nothing else in the time range names that ID: widen the range, or the user only uses SAML apps (the SP logs no Keycloak ID). Rows from support_kc_user_ids have kcid_join_only=1: drop them after.

[support_lockouts]
definition = `support_lockout_rules(5, 1000)`
description = Lockouts by rule, with identity-lab's brute-force settings: failureFactor 5, quickLoginCheckMilliSeconds 1000. Override in local/macros.conf with your realm's values (Realm settings > Security defences > Brute force detection).

[support_lockout_rules(2)]
args = failure_factor, quick_login_ms
definition = `support_index` ((sourcetype=idlab:keycloak kc_type=LOGIN_ERROR (kc_error=invalid_user_credentials OR kc_error=user_temporarily_disabled)) OR (sourcetype=idlab:sp event=oidc_login_ok sub=*) OR (sourcetype=idlab:keycloak:admin operationType=DELETE resourceType=USER_LOGIN_FAILURE)) \
| eval lk_id=case(sourcetype=="idlab:keycloak" AND kc_userId!="null", kc_userId, sourcetype=="idlab:sp", sub, sourcetype=="idlab:keycloak:admin", unlocked_user_id), lk_name=if(isnotnull(kc_username) AND kc_username!="null", kc_username, null()), lk_rp_name=if(sourcetype=="idlab:sp", coalesce(preferred_username, email), null()) \
| eventstats values(eval(if(sourcetype=="idlab:keycloak" AND kc_userId!="null", kc_userId, null()))) as lk_ids_for_name by lk_name \
| eval lk_id=coalesce(lk_id, mvindex(lk_ids_for_name, 0)), lk_kind=case(kc_error=="invalid_user_credentials", "failure", kc_error=="user_temporarily_disabled", "locked", sourcetype=="idlab:sp", "success", sourcetype=="idlab:keycloak:admin", "unlocked") \
| where isnotnull(lk_id) \
| eventstats values(lk_name) as lk_names values(lk_rp_name) as lk_rp_names by lk_id \
| sort 0 _time \
| eval lk_reset=if(lk_kind=="success" OR lk_kind=="unlocked", 1, 0), lk_fail_time=if(lk_kind=="failure", _time, null()) \
| streamstats sum(lk_reset) as lk_epoch by lk_id \
| streamstats current=f last(lk_fail_time) as lk_prev_fail by lk_id lk_epoch \
| eval lk_gap=if(lk_kind=="failure", _time - lk_prev_fail, null()) \
| streamstats count(lk_fail_time) as lk_n by lk_id lk_epoch \
| eval lk_unlock_time=if(lk_kind=="unlocked", _time, null()), lk_ok_time=if(lk_kind=="success", _time, null()) \
| sort 0 - _time \
| streamstats current=f last(lk_unlock_time) as lk_unlock_after last(lk_ok_time) as lk_ok_after by lk_id \
| eventstats min(eval(if(lk_kind=="locked", _time, null()))) as lk_locked_at by lk_id lk_epoch \
| where isnotnull(lk_locked_at) AND (lk_kind=="locked" OR (lk_kind=="failure" AND _time < lk_locked_at)) \
| eval lk_before=if(lk_kind=="failure", 1, 0) \
| stats min(lk_locked_at) as first_refused count(eval(lk_kind=="locked")) as refused sum(lk_before) as failures max(lk_fail_time) as last_failure min(eval(if(lk_before==1, lk_gap, null()))) as shortest_gap min(eval(if(lk_before==1 AND lk_gap * 1000 < $quick_login_ms$, lk_n, null()))) as quick_at min(eval(if(lk_kind=="locked", lk_unlock_after, null()))) as cleared_at min(eval(if(lk_kind=="locked", lk_ok_after, null()))) as ok_again values(app) as apps first(lk_names) as lk_names first(lk_rp_names) as lk_rp_names by lk_id lk_epoch \
| eval user=coalesce(mvindex(lk_names, 0), mvindex(lk_rp_names, 0), "user ID " . lk_id), shortest_gap=round(shortest_gap, 1) \
| eval rule=case(isnotnull(quick_at) AND quick_at < $failure_factor$, "quick login: two failed logins " . shortest_gap . " s apart (under " . ($quick_login_ms$ / 1000) . " s)", failures >= $failure_factor$, "max failures: " . failures . " failed logins (failureFactor " . $failure_factor$ . ")", isnotnull(quick_at), "quick login: two failed logins " . shortest_gap . " s apart (under " . ($quick_login_ms$ / 1000) . " s)", true(), "not clear from the logs: " . failures . " failed login(s) before it, fewer than failureFactor " . $failure_factor$ . ", none under " . ($quick_login_ms$ / 1000) . " s apart") \
| eval _time=if(match(rule, "^not clear"), first_refused, coalesce(last_failure, first_refused)), signature="kc_user_temporarily_disabled", user_id=lk_id \
| lookup support_causes signature OUTPUT cause runbook runbook_url \
| fields _time user user_id apps failures shortest_gap rule first_refused refused cleared_at ok_again signature cause runbook runbook_url
description = One row per lockout: the user (named, or by ID), when it most likely started (its last failure before Keycloak first refused them; when the rule is not clear, that first refusal), how many failed logins came before it and the shortest gap between two, which rule most likely fired, when Keycloak first refused them (user_temporarily_disabled: logged only when the locked user tries again), how often, and when an admin cleared it (cleared_at) or they next logged in (ok_again). Keycloak never logs the rule: it is inferred. Two failures under quick_login_ms apart before the failure_factor-th: quick login; otherwise failure_factor or more: max failures; otherwise not clear from the logs. Failures are counted since the user's last successful login the logs show (the OIDC RP's) or an admin unlock: a success at an app that logs nothing (a SAML app, a direct Keycloak login) is invisible, so the count can be too high, and failures outside the time range are missed. Lockout expiry is not modelled.

[support_mfa_signatures]
definition = (signature=kc_otp_invalid OR signature=kc_user_temporarily_disabled OR signature=kc_admin_realm_update OR signature=radius_reject_wrong_code OR signature=radius_reject_unknown_state OR signature=radius_challenge_unanswered OR signature=nas_challenge_unsupported OR signature=nas_challenge_no_message_authenticator)
description = The MFA failures (runbooks 20 to 23), and the realm change that can cause them, by signature.

[support_mfa_what]
definition = eval mfa_what=case(signature=="kc_otp_invalid", "wrong code (Keycloak)", signature=="radius_reject_wrong_code", "wrong code (RADIUS)", signature=="kc_user_temporarily_disabled", "locked out", signature=="kc_admin_realm_update", "realm settings changed", signature=="radius_challenge_unanswered", "challenge not answered", signature=="nas_challenge_unsupported", "NAS: no challenge-response", signature=="nas_challenge_no_message_authenticator", "NAS: no Message-Authenticator", signature=="radius_reject_unknown_state", "unknown State (RADIUS)")
description = A short label for each MFA signature (mfa_what), for chart series and tables.
