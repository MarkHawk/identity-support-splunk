[support_index]
definition = index=identity_support
description = Where the app's data lives. Override in local/macros.conf to use another index.

[support_failures]
definition = `support_index` ((tag=authentication action=failure) OR eventtype=idlab_radius_no_reply OR eventtype=idlab_keycloak_ldap_error)
description = Every failure the app knows a cause for: failed logins (CIM Authentication), RADIUS packets dropped without a reply, and Keycloak's LDAP errors.
