# One small index for everything the app reads. Searches go through the
# support_index macro, so pointing the app at another index is a one-line
# change in macros.conf (local/), not an edit to every search.

[identity_support]
homePath = $SPLUNK_DB/identity_support/db
coldPath = $SPLUNK_DB/identity_support/colddb
thawedPath = $SPLUNK_DB/identity_support/thaweddb
# 90 days: lab and support data, not an archive. A size cap is left to the
# Splunk admin (local/indexes.conf), as AppInspect requires.
frozenTimePeriodInSecs = 7776000
