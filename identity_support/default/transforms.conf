# Keycloak event fields: type="LOGIN_ERROR", realmName="idlab", clientId="oidc-rp",
# userId="null", ... props.conf aliases the ones the app uses to kc_*.
[idlab_keycloak_event_kv]
REGEX = \b([A-Za-z_]+)="([^"]*)"
FORMAT = $1::$2
MV_ADD = false

# The SP and RP log key=value pairs with Python's shlex.quote: a value with
# spaces or quotes is single-quoted, and a ' inside it is written '"'"'.
# Quoted values first, then plain ones.
[idlab_sp_kv_quoted]
REGEX = (?<![\w'])([a-z_]+)='((?:[^']|'"'"')*)'
FORMAT = $1::$2

[idlab_sp_kv_plain]
# Only a pair followed by another pair or the end of the line: not text like
# port=8180): inside a quoted value, or a URL's query string.
REGEX = (?<![\w'])([a-z_]+)=([^'\s]\S*)(?=\s+[a-z_]+=|\s*$)
FORMAT = $1::$2

[idlab_api_kv_plain]
# As idlab_sp_kv_plain, but a bare "-" (a claim the token doesn't have) is
# not a value.
REGEX = (?<![\w'])([a-z_]+)=(?!-(?:\s|$))([^'\s]\S*)(?=\s+[a-z_]+=|\s*$)
FORMAT = $1::$2

[idlab_sp_drop_healthz]
REGEX = "(?:GET|HEAD) /healthz[ ?]
DEST_KEY = queue
FORMAT = nullQueue

# The proxy's two logs share one stream (idlab:nginx). An error-log line
# starts with nginx's own YYYY/MM/DD stamp after docker's; an access line
# with the client address and the quoted request.
[idlab_nginx_access_sourcetype]
REGEX = ^\S+Z [^\s/]+ "
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::idlab:nginx:access

[idlab_nginx_error_sourcetype]
REGEX = ^\S+Z \d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2} \[
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::idlab:nginx:error

# Squid's access log and cache.log share one stream (idlab:squid). An
# access line starts with epoch seconds after docker's stamp; a cache.log
# message with Squid's own date and a "|".
[idlab_squid_access_sourcetype]
REGEX = ^\S+Z \d{10}\.\d{3}\s
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::idlab:squid:access

[idlab_squid_cache_sourcetype]
REGEX = ^\S+Z \d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}\|\s
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::idlab:squid:cache

# OpenSSL error code (Squid's TLS_LIB_ERR) -> OpenSSL's text for it. Only
# codes checked with `openssl errstr` (OpenSSL 3.5) are listed.
[squid_tls_lib_errors]
filename = squid_tls_lib_errors.csv
case_sensitive_match = false

# signature -> likely cause and the identity-lab runbook for it.
[support_causes]
filename = support_causes.csv
case_sensitive_match = true
