# Identity Support: when did it start, who is affected, and what is the
# likely cause, for identity-lab failures and the token-inspector and
# rate-limit-probe reports.

[install]
state = enabled

[ui]
is_visible = true
label = Identity Support

[launcher]
author = https://github.com/MarkHawk
description = Answers "when did it start, who is affected, and what is the likely cause?" for SSO, LDAP and RADIUS failures, with links to the matching runbooks.
version = 0.5.1

[package]
id = identity_support
check_for_updates = false

[id]
name = identity_support
version = 0.5.1
