# Login events (CIM Authentication: tagged authentication in tags.conf).
[idlab_keycloak_login]
search = sourcetype=idlab:keycloak (kc_type=LOGIN OR kc_type=LOGIN_ERROR OR kc_type=CODE_TO_TOKEN OR kc_type=CODE_TO_TOKEN_ERROR)
description = Keycloak login events from the jboss-logging event listener

[idlab_sp_login]
search = sourcetype=idlab:sp (event=saml_login_ok OR event=saml_login_failed OR event=oidc_login_ok OR event=oidc_login_failed)
description = Logins completed or refused at the SAML SP and OIDC RP

[idlab_api_auth]
search = sourcetype=idlab:api (event=api_request_ok OR event=api_token_rejected)
description = A call to the API with a bearer token: accepted, or refused with 401 (400 for a malformed header)

[idlab_radius_auth]
search = sourcetype=idlab:radius (radius_result=OK OR radius_result=incorrect)
description = RADIUS server answered an Access-Request (Access-Accept or Access-Reject)

[idlab_ldap_bind_failure]
search = sourcetype=idlab:slapd ldap_tag=97 err!=0
description = Directory refused a bind (err=49 is invalid credentials)

# Requests through the reverse proxy (CIM Web).
[idlab_proxy_access]
search = sourcetype=idlab:nginx:access
description = A request through the reverse proxy, with what its upstream did

# Requests through the egress (forward) proxy (CIM Web).
[idlab_egress_access]
search = sourcetype=idlab:squid:access
description = A request through the egress proxy: what Squid did with it

# Failures that are not logins.
[idlab_radius_no_reply]
search = (sourcetype=idlab:radius radius_outcome="no reply") OR (sourcetype=idlab:nas radius_outcome="no reply")
description = RADIUS request dropped or ignored: the NAS gets no reply at all

[idlab_keycloak_ldap_error]
search = sourcetype=idlab:keycloak ldap_result_code=*
description = Keycloak's LDAP federation failed; ldap_result_code=49 means its bind credential was rejected

[idlab_proxy_error]
search = (sourcetype=idlab:nginx:error OR sourcetype=idlab:nginx:access) signature=proxy_*
description = The reverse proxy refused a request: 502, 504 or 429 with its reason in the error log, or a 503 it answered itself or a client certificate it refused (400), from the access log

[idlab_egress_error]
search = (sourcetype=idlab:squid:access OR sourcetype=idlab:squid:cache) signature=egress_proxy_*
description = The egress proxy refused a request (407, 403) or the client rejected its intercepted TLS, and logged it

[idlab_api_cors_mismatch]
search = sourcetype=idlab:api event=api_request_ok signature=api_cors_origin_mismatch
description = The API accepted a call from a browser page but sent an Access-Control-Allow-Origin that doesn't match the page's origin, so the browser blocks the response

[idlab_token_inspector]
search = sourcetype=token_inspector:report
description = token-inspector report

[idlab_rate_limit_probe]
search = sourcetype=rate_limit_probe:report
description = rate-limit-probe report
