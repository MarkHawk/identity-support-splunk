# Alerts. Each result row carries runbook_url, and each description names
# the identity-lab runbook. No actions are configured: a fired alert is
# listed under Activity > Triggered Alerts. Add email or webhook actions in
# local/ if you want them.
#
# Splunk Free has no alerting: there these still run as reports from the
# Reports page, but are not scheduled.

[SSO failure rate jumped]
description = More than three times the usual rate of failed SSO logins (SAML SP, OIDC RP, Keycloak) in the last 10 minutes, and at least 5. Runbooks: https://github.com/MarkHawk/identity-lab/tree/main/runbooks (01 expired signing certificate, 02 clock skew, 03 redirect URI mismatch, 04 LDAP bind failure).
search = `support_index` tag=authentication action=failure (eventtype=idlab_keycloak_login OR eventtype=idlab_sp_login) \
| eval window=if(_time >= relative_time(now(), "-10m@m"), "recent", "baseline") \
| eval recent_cause=if(window=="recent", coalesce(cause, signature), null()), recent_runbook=if(window=="recent", runbook_url, null()), recent_user=if(window=="recent", user, null()) \
| stats count(eval(window=="recent")) as recent count(eval(window=="baseline")) as baseline dc(recent_user) as users values(recent_cause) as causes values(recent_runbook) as runbook_url \
| eval baseline_per_10m=round(baseline / 6, 1) \
| where recent >= 5 AND recent > 3 * baseline_per_10m
dispatch.earliest_time = -70m@m
dispatch.latest_time = @m
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 30m
alert.digest_mode = 1

[RADIUS server not responding]
description = RADIUS requests dropped or ignored in the last 5 minutes, so the NAS gets no reply and users see a timeout. Usually a shared secret mismatch or an unknown NAS address. Runbook: https://github.com/MarkHawk/identity-lab/blob/main/runbooks/05-radius-shared-secret-mismatch.md
search = `support_index` eventtype=idlab_radius_no_reply \
| stats count min(_time) as first_seen max(_time) as last_seen values(src) as src values(nas_client) as nas by signature cause runbook_url \
| eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S"), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S")
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 30m
alert.digest_mode = 1

[LDAP bind failing (result 49)]
description = The directory refused a service account's bind with result 49 (invalid credentials), or the IdP's LDAP federation failed with it, in the last 15 minutes. This breaks every directory user's login. A single user's wrong password (a uid= bind) does not trigger it. Runbook: https://github.com/MarkHawk/identity-lab/blob/main/runbooks/04-ldap-bind-failure.md
search = `support_index` ((sourcetype=idlab:slapd ldap_op=BIND) OR (sourcetype=idlab:slapd ldap_tag=97) OR eventtype=idlab_keycloak_ldap_error) \
| eval key=if(sourcetype=="idlab:slapd", host . ":" . conn . ":" . op, _cd) \
| stats min(_time) as time values(bind_dn) as bind_dn values(err) as err values(ldap_result_code) as idp_code by key \
| where (err=="49" AND NOT match(bind_dn, "^uid=")) OR idp_code=="49" \
| eval bind_dn=coalesce(bind_dn, "(IdP federation)"), runbook_url="https://github.com/MarkHawk/identity-lab/blob/main/runbooks/04-ldap-bind-failure.md" \
| stats count min(time) as first_seen max(time) as last_seen by bind_dn runbook_url \
| eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S"), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S")
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 1
alert.suppress.period = 30m
alert.digest_mode = 1

[SAML certificate or clock problem]
description = The SAML SP refused logins because of the IdP's signing certificate or clock skew in the last 15 minutes. Runbooks: https://github.com/MarkHawk/identity-lab/blob/main/runbooks/01-expired-signing-cert.md and https://github.com/MarkHawk/identity-lab/blob/main/runbooks/02-clock-skew.md
search = `support_index` sourcetype=idlab:sp (signature=saml_idp_cert_expired OR signature=saml_signature_invalid OR signature=saml_clock_skew) \
| stats count min(_time) as first_seen max(_time) as last_seen by signature cause runbook_url \
| eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S"), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S")
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 30m
alert.digest_mode = 1

[Reverse proxy 502/504 spike]
description = The reverse proxy answered 502 Bad Gateway or 504 Gateway Time-out at least 3 times in the last 5 minutes. Each row gives the reasons from the proxy's error log with their runbooks. Runbooks: https://github.com/MarkHawk/identity-lab/blob/main/runbooks/06-proxy-bad-gateway.md (bad gateway), https://github.com/MarkHawk/identity-lab/blob/main/runbooks/07-proxy-gateway-timeout.md (timeout) and https://github.com/MarkHawk/identity-lab/blob/main/runbooks/10-proxy-header-too-large.md (IdP headers too large).
search = `support_index` ((sourcetype=idlab:nginx:access (status=502 OR status=504)) OR (eventtype=idlab_proxy_error signature!=proxy_rate_limited)) \
| eval response=if(sourcetype=="idlab:nginx:access", status, null()), route=if(sourcetype=="idlab:nginx:access", site, null()) \
| stats count(response) as responses values(response) as statuses values(route) as routes values(cause) as causes values(runbook_url) as runbook_url min(_time) as first_seen max(_time) as last_seen \
| where responses >= 3 \
| eval causes=coalesce(causes, "no reason in the proxy's error log: the app behind it may have answered 502 or 504 itself"), runbook_url=coalesce(runbook_url, "https://github.com/MarkHawk/identity-lab/blob/main/runbooks/06-proxy-bad-gateway.md") \
| eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S"), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S")
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 30m
alert.digest_mode = 1

[Reverse proxy rate limiting logins]
description = The reverse proxy's rate limit refused at least 3 requests (429) in the last 5 minutes, before they reached the IdP. When every user reaches the proxy from one address (a NAT or another load balancer), this locks out everyone at once. Runbook: https://github.com/MarkHawk/identity-lab/blob/main/runbooks/08-proxy-rate-limit.md
search = `support_index` eventtype=idlab_proxy_error signature=proxy_rate_limited \
| stats count dc(src) as clients values(src) as src values(limit_zone) as zones values(site) as routes min(_time) as first_seen max(_time) as last_seen by cause runbook_url \
| where count >= 3 \
| eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S"), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S")
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 30m
alert.digest_mode = 1

[rate-limit-probe found a problem]
description = A rate-limit-probe report in the last hour has a FAIL: the API's limiter misbehaves (wrong Retry-After, a penalty for retrying early, and so on). See the report's likely cause and next step.
search = `support_index` eventtype=idlab_rate_limit_probe summary.fail>0 \
| table _time target_url status_429 verdict likely_cause
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
cron_schedule = 7 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.digest_mode = 1
